[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spasstocsv"
version = "0.2.0"
description = "Decrypt Samsung Pass .spass exports and convert them locally."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "cryptography>=41.0.0",
]

[project.scripts]
spasstocsv = "spasstocsv.cli:main"

[tool.setuptools]
packages = ["spasstocsv"]
