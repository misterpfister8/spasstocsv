name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: List CLI formats
        run: spasstocsv --list-formats
      - name: Run unit tests
        run: python -m unittest
      - name: Compile wrapper
        run: python -m py_compile spass_to_csv.py
      - name: CLI smoke test
        run: |
          printf 'demo-password\n' | python spass_to_csv.py \
            --password-stdin \
            -i tests/fixtures/demo_full.spass \
            -o /tmp/spasstocsv-demo.csv \
            --format chrome
      - name: Install build tooling
        run: python -m pip install build
      - name: Build wheel and sdist
        run: python -m build
      - name: Install built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Installed CLI smoke test
        run: |
          printf 'demo-password\n' | spasstocsv \
            --password-stdin \
            -i tests/fixtures/demo_full.spass \
            -o /tmp/spasstocsv-installed-demo.csv \
            --format chrome
